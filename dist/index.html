<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Viam Dashboard</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 1rem;
      }
      #status {
        font-weight: bold;
      }
      #status.connected {
        color: green;
      }
      #status.disconnected {
        color: red;
      }
      #camera {
        width: 640px;
        max-width: 100%;
        background: #222;
      }
      .panel {
        margin: 1rem 0;
        padding: 1rem;
        border: 1px solid #ccc;
      }
      button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
      }
      #uploadedImage,
      #pointsPreview {
        display: block;
        max-width: 640px;
        width: 100%;
        margin-top: 0.5rem;
      }
      #pointsPreview {
        background: #fff;
        border: 1px solid #ccc;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CyTqosGa.js"></script>
  </head>
  <body>
    <h1>My Viam Dashboard</h1>
    <p>Status: <span id="status">Connecting...</span></p>
    <div class="panel">
      <h2>Upload image</h2>
      <input type="file" id="imageUpload" accept="image/*" />
      <img id="uploadedImage" alt="Uploaded preview" hidden />
      <canvas id="pointsPreview" width="640" height="640" hidden></canvas>
    </div>

    <div class="panel">
      <button id="start">Start drawing</button>
      <button id="stop">Stop drawing</button>
    </div>

    <div class="panel">
      <h2>Camera</h2>
      <video id="camera" autoplay playsinline muted></video>
    </div>

    <div class="panel">
      <h2>Status</h2>
      <pre id="drawstatus">—</pre>
    </div>

  </body>
</html>
